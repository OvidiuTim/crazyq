<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d47e5" />
    <title>CrazyQ · Joacă</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="play-page">
    <main class="play-shell">
      <header class="play-header">
        <a class="brand" href="/play" aria-label="CrazyQ">
          <span class="brand-mark" aria-hidden="true">?</span>
          <span>CrazyQ</span>
        </a>
        <span class="mini-session" id="miniSession" hidden>—</span>
      </header>

      <div class="connection-toast mobile-toast" id="connectionMessage" role="status" aria-live="polite" hidden></div>

      <section class="join-card" id="joinView">
        <div class="join-intro">
          <p class="eyebrow">Intră în joc</p>
          <h1>E gașca pregătită?</h1>
          <p class="lead">Ai nevoie doar de cod și de un nume memorabil.</p>
        </div>

        <form id="joinForm" novalidate>
          <label for="sessionInput">Cod sesiune</label>
          <input
            class="code-input"
            id="sessionInput"
            name="session"
            type="text"
            inputmode="text"
            maxlength="4"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="ABCD"
            required
          />

          <label for="nameInput">Numele tău</label>
          <input
            id="nameInput"
            name="name"
            type="text"
            maxlength="30"
            autocomplete="name"
            placeholder="Ex: Mara"
            required
          />

          <button class="button button-primary button-large button-full" id="joinButton" type="submit">
            Join
          </button>
          <p class="message error-message" id="joinMessage" role="alert" aria-live="assertive"></p>
        </form>
      </section>

      <section class="player-game" id="gameView" hidden>
        <div class="player-statusbar">
          <span id="playerPhase">Lobby</span>
          <strong id="playerName"></strong>
        </div>

        <section class="mobile-game-card">
          <div class="mobile-question-meta">
            <span id="playerQuestionNumber">Așteptăm hostul</span>
            <div class="timer mobile-timer" id="playerTimerBox" hidden>
              <span class="timer-value" id="playerTimerValue">15</span>
              <span class="timer-unit">sec</span>
            </div>
          </div>
          <h1 class="mobile-question" id="playerQuestion">Jocul începe în curând.</h1>
          <div class="player-phase-content" id="playerPhaseContent"></div>
          <p class="message error-message" id="playerMessage" role="alert" aria-live="assertive"></p>
        </section>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/play.js"></script>
  </body>
</html>
